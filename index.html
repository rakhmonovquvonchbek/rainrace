<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rainrace</title>
  <meta name="description" content="Type fast, drive fast. A Monkeytype-style typing racer on a rainy night track." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23070a0e' width='32' height='32' rx='6'/%3E%3Cpath d='M8 18 L16 10 L24 18' fill='none' stroke='%233ef0c5' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M10 22h12' stroke='%233ef0c5' stroke-width='2' stroke-linecap='round' opacity='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="rain-canvas" aria-hidden="true"></canvas>
  <div id="flash" aria-hidden="true"></div>

  <div id="app" tabindex="-1">
    <header class="topbar">
      <button type="button" class="brand" id="brand-btn" title="Back to menu">
        <span class="logo-mark" aria-hidden="true"></span>
        rainrace
      </button>
      <button type="button" id="mute-btn" class="icon-btn" aria-label="Mute sound" aria-pressed="false" title="Mute">
        <svg id="icon-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M4 9v6h3.2L12 19.2V4.8L7.2 9H4zm13.5 3a4.5 4.5 0 0 0-2.3-3.9v7.8A4.5 4.5 0 0 0 17.5 12zm-2.3-8.2v2.1A7.5 7.5 0 0 1 20.5 12a7.5 7.5 0 0 1-5.3 7.1v2.1A9.5 9.5 0 0 0 22.5 12a9.5 9.5 0 0 0-7.3-9.2z"/>
        </svg>
        <svg id="icon-off" class="hidden" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M4 9v6h3.2L12 19.2V4.8L7.2 9H4zm16.7 8.3-1.4 1.4-3.1-3.1A7.5 7.5 0 0 1 12.2 19v-2.1a5.5 5.5 0 0 0 2.8-1.6l-2.3-2.3V9.6l6.1 6.1c.10.10.0.4.9 1.6zm-2.5-9.6-1.5 1.5A5.5 5.5 0 0 0 12.2 7.1V5a7.5 7.5 0 0 1 6 3.7zM9.2 6.8 7.8 5.4 4.9 8.3 3.5 6.9 2 8.3l2.9 2.9L2 14.1l1.4 1.4 2.9-2.9 2.9 2.9 1.4-1.4-2.9-2.9 2.9-2.9z"/>
        </svg>
      </button>
    </header>

    <div id="track-wrap">
      <canvas id="track-canvas"></canvas>
    </div>

    <div id="hud" class="hud hidden" aria-live="off">
      <div class="hud-item"><span id="hud-wpm">0</span><label>wpm</label></div>
      <div class="hud-item"><span id="hud-acc">100</span><label>acc</label></div>
      <div class="hud-item"><span id="hud-time">0.0</span><label>time</label></div>
      <div class="hud-item faint"><span id="hud-words">0/25</span><label>words</label></div>
    </div>

    <main id="stage">
      <section id="menu" class="panel">
        <p class="tagline">type fast · drive faster</p>
        <div class="config">
          <div class="config-row">
            <span class="config-label">list</span>
            <div class="pills" id="diff-pills" role="group" aria-label="Difficulty">
              <button type="button" class="pill" data-diff="starter">starter</button>
              <button type="button" class="pill active" data-diff="common">common</button>
              <button type="button" class="pill" data-diff="steady">steady</button>
            </div>
          </div>
          <div class="config-row">
            <span class="config-label">length</span>
            <div class="pills" id="count-pills" role="group" aria-label="Word count">
              <button type="button" class="pill" data-count="10">10</button>
              <button type="button" class="pill active" data-count="25">25</button>
              <button type="button" class="pill" data-count="50">50</button>
              <button type="button" class="pill" data-count="100">100</button>
            </div>
          </div>
        </div>
        <p class="diff-blurb" id="diff-blurb">Top 300 English words · a steady night drive</p>
        <button type="button" id="start-btn" class="start-btn">race</button>
        <p class="start-hint">press <kbd>enter</kbd> or type to start</p>
      </section>

      <section id="race-panel" class="hidden">
        <div id="caps-warn" class="hidden">caps lock</div>
        <div id="words-viewport">
          <div id="words"></div>
          <div id="caret"></div>
        </div>
        <div id="focus-warning" class="hidden">click to focus</div>
      </section>

      <section id="results" class="panel hidden">
        <div class="results-head">
          <div>
            <div class="stat-wpm" id="res-wpm">0</div>
            <div class="stat-wpm-label">wpm <span id="pb-badge" class="pb-badge hidden">new pb</span></div>
          </div>
          <div class="place" id="res-place"></div>
        </div>
        <div class="results-grid">
          <div><span id="res-acc">100</span><label>accuracy</label></div>
          <div><span id="res-streak">0</span><label>best streak</label></div>
          <div><span id="res-time">0.00</span><label>time</label></div>
          <div><span id="res-pb">—</span><label>personal best</label></div>
        </div>
        <div class="chart-wrap">
          <canvas id="chart-canvas" width="640" height="160"></canvas>
          <p class="chart-caption" id="chart-caption">last races in this mode</p>
        </div>
        <div class="results-actions">
          <button type="button" id="restart-btn" class="start-btn">restart</button>
          <button type="button" id="menu-btn" class="ghost-btn">menu</button>
        </div>
        <p class="start-hint"><kbd>tab</kbd> or <kbd>enter</kbd> to race again · <kbd>esc</kbd> menu</p>
      </section>
    </main>

    <footer class="hintbar">
      <span id="hints">esc menu · tab restart · mute in the corner</span>
    </footer>
  </div>

  <script src="words.js"></script>
  <script src="game.js"></script>
</body>
</html>
